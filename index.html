<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeTool – Safety Help in Any Language</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1c1b19;--mute:#6b665c;--line:#e6dfcf;--acc:#f59e0b;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--soft:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--card:#1e1c17;--ink:#f3efe4;--mute:#a49e8f;--line:#35322a;--soft:#2b2412;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14130f;--card:#1e1c17;--ink:#f3efe4;--mute:#a49e8f;--line:#35322a;--soft:#2b2412;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px}
select{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
input[type=text]{flex:1;min-width:0;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus{outline:none;border-color:var(--acc)}
.btn{padding:13px 16px;border:0;border-radius:12px;background:var(--acc);color:#1c1b19;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
input[type=file]{display:none}
#pv{max-width:100%;max-height:260px;border-radius:12px;display:none;margin:0 auto 10px}
h2{font-size:1.05rem;margin:0 0 6px}
ul,ol{margin:4px 0 0;padding-inline-start:22px}li{margin:3px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff}
.low{background:#15803d}.medium{background:#b45309}.high{background:#b91c1c}
.ppe h2{color:var(--warn)}.do h2{color:var(--ok)}.dont h2,.emg h2{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
.mute{color:var(--mute);font-size:.88rem}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-inline-end:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<h1>⛑️ Safe<span>Tool</span></h1>
<p class="sub">Type any tool, machine or job in any language, or take a photo.</p>
<div class="card"><label for="lang"><b>🌐 Answer language</b></label><select id="lang"><option value="auto">Auto (same language I type)</option><option value="English">English</option><option value="Spanish">Español (Spanish)</option><option value="French">Français (French)</option><option value="German">Deutsch (German)</option><option value="Italian">Italiano (Italian)</option><option value="Portuguese">Português (Portuguese)</option><option value="Dutch">Nederlands (Dutch)</option><option value="Swedish">Svenska (Swedish)</option><option value="Norwegian">Norsk (Norwegian)</option><option value="Danish">Dansk (Danish)</option><option value="Finnish">Suomi (Finnish)</option><option value="Polish">Polski (Polish)</option><option value="Czech">Čeština (Czech)</option><option value="Slovak">Slovenčina (Slovak)</option><option value="Hungarian">Magyar (Hungarian)</option><option value="Romanian">Română (Romanian)</option><option value="Bulgarian">Български (Bulgarian)</option><option value="Greek">Ελληνικά (Greek)</option><option value="Ukrainian">Українська (Ukrainian)</option><option value="Russian">Русский (Russian)</option><option value="Serbian">Српски (Serbian)</option><option value="Croatian">Hrvatski (Croatian)</option><option value="Turkish">Türkçe (Turkish)</option><option value="Arabic">العربية (Arabic)</option><option value="Hebrew">עברית (Hebrew)</option><option value="Persian">فارسی (Persian)</option><option value="Urdu">اردو (Urdu)</option><option value="Roman Urdu">Roman Urdu</option><option value="Hindi">हिन्दी (Hindi)</option><option value="Punjabi">پنجابی / ਪੰਜਾਬੀ (Punjabi)</option><option value="Pashto">پښتو (Pashto)</option><option value="Sindhi">سنڌي (Sindhi)</option><option value="Bengali">বাংলা (Bengali)</option><option value="Tamil">தமிழ் (Tamil)</option><option value="Telugu">తెలుగు (Telugu)</option><option value="Marathi">मराठी (Marathi)</option><option value="Gujarati">ગુજરાતી (Gujarati)</option><option value="Nepali">नेपाली (Nepali)</option><option value="Sinhala">සිංහල (Sinhala)</option><option value="Chinese (Simplified)">简体中文 (Chinese Simplified)</option><option value="Chinese (Traditional)">繁體中文 (Chinese Traditional)</option><option value="Japanese">日本語 (Japanese)</option><option value="Korean">한국어 (Korean)</option><option value="Thai">ไทย (Thai)</option><option value="Vietnamese">Tiếng Việt (Vietnamese)</option><option value="Indonesian">Bahasa Indonesia</option><option value="Malay">Bahasa Melayu (Malay)</option><option value="Filipino">Filipino</option><option value="Swahili">Kiswahili (Swahili)</option><option value="Hausa">Hausa</option><option value="Amharic">አማርኛ (Amharic)</option><option value="Zulu">isiZulu (Zulu)</option><option value="Afrikaans">Afrikaans</option><option value="Kazakh">Қазақша (Kazakh)</option><option value="Uzbek">Oʻzbekcha (Uzbek)</option><option value="Azerbaijani">Azərbaycanca (Azerbaijani)</option><option value="other">Other language (type its name)</option></select><input type="text" id="otherlang" placeholder="Type any language, e.g. Kurdish, Tagalog, Welsh…" style="display:none;margin-top:8px;width:100%"></div>
<div class="card">
<div class="row"><input type="text" id="q" placeholder="e.g. angle grinder, سیڑھی, cement mixer, welding…" aria-label="Tool or job"><button class="btn" id="go">Search</button></div>
<div class="chips" id="chips"></div>
<div class="row" style="margin-top:12px">
<label class="btn sec" for="cam" style="flex:1;text-align:center">📷 Photo</label><input type="file" id="cam" accept="image/*" capture="environment">
<label class="btn sec" for="gal" style="flex:1;text-align:center">🖼️ Gallery</label><input type="file" id="gal" accept="image/*">
</div>
</div>
<img id="pv" alt="Your photo">
<div id="out"></div>
<p class="mute">Photos you take are sent to Google’s AI to analyse. AI guidance is general and can be wrong. Always follow the manufacturer’s manual and local safety rules. In an emergency, call your local emergency number.</p>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},busy=false;
var WORKER_URL="https://safetool-api.faheemlucky27.workers.dev/";
["Construction site","Welding","Electrical work","Working at height","Farming machines","Kitchen / gas","Chemicals","Factory machines","Heavy lifting","Digging"].forEach(function(c){
 var b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=function(){$("q").value=c;search()};$("chips").appendChild(b)});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function L(t,a,c,o){if(!a||!a.length)return"";var k=o?"ol":"ul";return'<div class="card '+c+'"><h2>'+t+"</h2><"+k+">"+a.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</"+k+"></div>"}
function lv(r){r=String(r||"medium").toLowerCase();return r==="low"||r==="high"?r:"medium"}
function pick(d){var k=function(){for(var i=0;i<arguments.length;i++){var v=d[arguments[i]];if(typeof v==="string")v=v.split(/\n|;/).filter(Boolean);if(v&&v.length)return v}return[]};
 return{ppe:k("ppe","PPE","protective_equipment"),hazards:k("hazards","risks"),before:k("before","before_use","preparation","checks"),safe_steps:k("safe_steps","steps","safe_use_steps","how_to_use"),dont:k("dont","donts","never"),when_to_stop:k("when_to_stop","stop"),emergency:k("emergency","first_aid")}}
function render(d){
 var p=pick(d),H=d.headings||{};function h(k,def){return esc(H[k]||def)}
 var o='<div dir="'+(d.dir==="rtl"?"rtl":"ltr")+'">';
 o+='<div class="card"><h2 style="font-size:1.25rem">'+esc(d.title)+'</h2><span class="badge '+lv(d.risk_level)+'">'+esc(d.risk_label||(d.risk_level||"").toUpperCase())+"</span><p>"+esc(d.summary)+"</p></div>";
 o+=L("🦺 "+h("ppe","Wear this (PPE)"),p.ppe,"ppe")+L("⚠️ "+h("hazards","Main hazards"),p.hazards,"")+L("🔍 "+h("before","Check before you start"),p.before,"")+L("✅ "+h("steps","Safe steps"),p.safe_steps,"do",1)+L("🚫 "+h("dont","Never do this"),p.dont,"dont")+L("✋ "+h("stop","Stop and get help if"),p.when_to_stop,"emg")+L("🚑 "+h("emergency","If something goes wrong"),p.emergency,"emg");
 if(!(p.ppe.length+p.hazards.length+p.before.length+p.safe_steps.length+p.dont.length+p.emergency.length))o+='<div class="card err">The AI replied without details.<br><small>'+esc(JSON.stringify(d).slice(0,300))+"</small></div>";
 return o+"</div>";
}
function fail(e){var m="Something went wrong. Please try again.",x="";
 if(e instanceof TypeError)m="Cannot reach the helper.",x="Check ALLOWED_ORIGIN in Cloudflare. It must be https://faheemlucky27-eng.github.io";
 else if(e instanceof SyntaxError)m="The AI reply was not in the expected format. Try again.";
 else if(e&&e.code==="rate_limited")m="Too many requests. Wait a moment and try again.",x=e.msg||"";
 else if(e&&e.msg)x=e.msg;
 $("out").innerHTML='<div class="card err">'+esc(m)+(x?'<br><small>'+esc(x)+"</small>":"")+"</div>"}
var FMT='Reply ONLY with JSON: {"title":string,"risk_level":"low|medium|high","risk_label":"the word RISK translated, e.g. HIGH RISK, in the answer language","summary":"1-2 sentences: what it is or the job, and the main danger","dir":"rtl or ltr","headings":{"ppe":string,"hazards":string,"before":string,"steps":string,"dont":string,"stop":string,"emergency":string},"ppe":[string],"hazards":[string],"before":[string],"safe_steps":[string],"dont":[string],"when_to_stop":[string],"emergency":[string]}. Be thorough and practical: 6 to 10 items in each list and 8 to 12 clear steps in safe_steps, each item one sentence (under 30 words). Cover the standard safety practice for the exact equipment or task: inspection, setup, operation, shutdown and cleanup. @@ JSON keys stay English. If the item is extremely dangerous or needs a licensed professional (live high-voltage, gas lines, structural work), say so clearly in summary and when_to_stop. If the text is not a tool or job, set summary to say so and keep lists short.';
function langLine(){var l=$("lang").value;if(l==="other")l=($("otherlang").value||"").trim()||"English";return l==="auto"?"Write every text value, including headings, in the SAME language and script as the user query (Roman Urdu stays Roman Urdu); if no query, use English.":"Write every text value, including headings, in "+l+". Use that language's natural script."}
function FM(){return FMT.replace("@@",langLine())}
function b64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(String(f.result).split(",")[1])};f.readAsDataURL(b)})}
async function run(prompt,imgs){
 if(busy)return;
 if(WORKER_URL.indexOf("http")!==0){$("out").innerHTML='<div class="card err">App is not connected yet. Set WORKER_URL in index.html.</div>';return}
 busy=true;$("out").innerHTML='<div class="card"><span class="spin"></span>…</div>';
 try{
  var body={prompt:prompt};if(imgs&&imgs[0])body.image=await b64(imgs[0]);
  var r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){var er="";try{er=(await r.json()).error||""}catch(x){}throw{code:r.status===429?"rate_limited":"err",msg:"("+r.status+") "+er}}
  var j=await r.json(),t=String(j.text||"").replace(/```json|```/g,"").trim();
  $("out").innerHTML=render(JSON.parse(t));$("out").scrollIntoView({behavior:"smooth"});
 }catch(e){fail(e)}
 busy=false;
}
function search(){var t=$("q").value.trim();if(!t)return;$("pv").style.display="none";
 run("You are a workplace, construction, farming and home safety expert helping ordinary people. The user searched: \""+t.replace(/"/g,"'")+"\". Identify whether it is a tool, machine or a type of work, and give practical safety guidance. "+FM())}
function toBlob(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",.82);URL.revokeObjectURL(u)};im.onerror=rej;im.src=u})}
async function photo(f){
 if(!f)return;
 try{var b=await toBlob(f);$("pv").src=URL.createObjectURL(b);$("pv").style.display="block";
  var t=$("q").value.trim();
  run("You are a workplace, construction, farming and home safety expert. Identify the tool, machine or work activity in the photo and give practical safety guidance for ordinary people. If unsure of the exact model, say so and give guidance for the type. If nothing relevant is visible, say so in summary. The user's language hint: \""+(t||"none, use English").replace(/"/g,"'")+"\". "+FM(),[b])}catch(e){fail(e)}
}
$("lang").onchange=function(){$("otherlang").style.display=this.value==="other"?"block":"none"};
$("go").onclick=search;$("q").onkeydown=function(e){if(e.key==="Enter")search()};
$("cam").onchange=function(){photo(this.files[0]);this.value=""};$("gal").onchange=function(){photo(this.files[0]);this.value=""};
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafeTool – Safety Help in Any Language</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--ink:#1c1b19;--mute:#6b665c;--line:#e6dfcf;--acc:#f59e0b;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--soft:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14130f;--card:#1e1c17;--ink:#f3efe4;--mute:#a49e8f;--line:#35322a;--soft:#2b2412;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14130f;--card:#1e1c17;--ink:#f3efe4;--mute:#a49e8f;--line:#35322a;--soft:#2b2412;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Nastaliq Urdu",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 4px}h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus{outline:none;border-color:var(--acc)}
.btn{padding:13px 16px;border:0;border-radius:12px;background:var(--acc);color:#1c1b19;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.88rem;cursor:pointer}
input[type=file]{display:none}
#pv{max-width:100%;max-height:260px;border-radius:12px;display:none;margin:0 auto 10px}
h2{font-size:1.05rem;margin:0 0 6px}
ul,ol{margin:4px 0 0;padding-inline-start:22px}li{margin:3px 0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff}
.low{background:#15803d}.medium{background:#b45309}.high{background:#b91c1c}
.ppe h2{color:var(--warn)}.do h2{color:var(--ok)}.dont h2,.emg h2{color:var(--bad)}
.err{color:var(--bad);font-weight:600}
.mute{color:var(--mute);font-size:.88rem}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-inline-end:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
<h1>⛑️ Safe<span>Tool</span></h1>
<p class="sub">Type any tool, machine or job in any language, or take a photo.</p>
<div class="card">
<div class="row"><input type="text" id="q" placeholder="e.g. angle grinder, سیڑھی, cement mixer, welding…" aria-label="Tool or job"><button class="btn" id="go">Search</button></div>
<div class="chips" id="chips"></div>
<div class="row" style="margin-top:12px">
<label class="btn sec" for="cam" style="flex:1;text-align:center">📷 Photo</label><input type="file" id="cam" accept="image/*" capture="environment">
<label class="btn sec" for="gal" style="flex:1;text-align:center">🖼️ Gallery</label><input type="file" id="gal" accept="image/*">
</div>
</div>
<img id="pv" alt="Your photo">
<div id="out"></div>
<p class="mute">AI guidance is general and can be wrong. Always follow the manufacturer’s manual and local safety rules. In an emergency, call your local emergency number.</p>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},busy=false;
var WORKER_URL="https://safetool-api.faheemlucky27.workers.dev/";
["Construction site","Welding","Electrical work","Working at height","Farming machines","Kitchen / gas","Chemicals","Factory machines","Heavy lifting","Digging"].forEach(function(c){
 var b=document.createElement("button");b.className="chip";b.textContent=c;b.onclick=function(){$("q").value=c;search()};$("chips").appendChild(b)});
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function L(t,a,c,o){if(!a||!a.length)return"";var k=o?"ol":"ul";return'<div class="card '+c+'"><h2>'+t+"</h2><"+k+">"+a.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</"+k+"></div>"}
function lv(r){r=String(r||"medium").toLowerCase();return r==="low"||r==="high"?r:"medium"}
function render(d){
 var H=d.headings||{};function h(k,def){return esc(H[k]||def)}
 var o='<div dir="'+(d.dir==="rtl"?"rtl":"ltr")+'">';
 o+='<div class="card"><h2 style="font-size:1.25rem">'+esc(d.title)+'</h2><span class="badge '+lv(d.risk_level)+'">'+esc(d.risk_label||(d.risk_level||"").toUpperCase())+"</span><p>"+esc(d.summary)+"</p></div>";
 o+=L("🦺 "+h("ppe","Wear this (PPE)"),d.ppe,"ppe")+L("⚠️ "+h("hazards","Main hazards"),d.hazards,"")+L("🔍 "+h("before","Check before you start"),d.before,"")+L("✅ "+h("steps","Safe steps"),d.safe_steps,"do",1)+L("🚫 "+h("dont","Never do this"),d.dont,"dont")+L("✋ "+h("stop","Stop and get help if"),d.when_to_stop,"emg")+L("🚑 "+h("emergency","If something goes wrong"),d.emergency,"emg");
 return o+"</div>";
}
function fail(e){var m=e&&e.code==="not_granted"?"Something went wrong. Please try again.":e&&e.code==="rate_limited"?"Too many requests. Wait a moment and try again.":"Could not get a result. Please try again.";$("out").innerHTML='<div class="card err">'+m+"</div>"}
var FMT='Reply ONLY with JSON: {"title":string,"risk_level":"low|medium|high","risk_label":"the word RISK translated, e.g. HIGH RISK, in the answer language","summary":"1-2 sentences: what it is or the job, and the main danger","dir":"rtl or ltr","headings":{"ppe":string,"hazards":string,"before":string,"steps":string,"dont":string,"stop":string,"emergency":string},"ppe":[string],"hazards":[string],"before":[string],"safe_steps":[string],"dont":[string],"when_to_stop":[string],"emergency":[string]}. Each list has 3 to 7 short items (under 20 words each). Write every text value, including headings, in the SAME language and script as the user query (Roman Urdu stays Roman Urdu); if no query, use English. JSON keys stay English. If the item is extremely dangerous or needs a licensed professional (live high-voltage, gas lines, structural work), say so clearly in summary and when_to_stop. If the text is not a tool or job, set summary to say so and keep lists short.';
function b64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(String(f.result).split(",")[1])};f.readAsDataURL(b)})}
async function run(prompt,imgs){
 if(busy)return;
 if(WORKER_URL.indexOf("http")!==0){$("out").innerHTML='<div class="card err">App is not connected yet. Set WORKER_URL in index.html.</div>';return}
 busy=true;$("out").innerHTML='<div class="card"><span class="spin"></span>…</div>';
 try{
  var body={prompt:prompt};if(imgs&&imgs[0])body.image=await b64(imgs[0]);
  var r=await fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===429)throw{code:"rate_limited"};
  if(!r.ok)throw{code:"err"};
  var j=await r.json(),t=String(j.text||"").replace(/```json|```/g,"").trim();
  $("out").innerHTML=render(JSON.parse(t));$("out").scrollIntoView({behavior:"smooth"});
 }catch(e){fail(e)}
 busy=false;
}
function search(){var t=$("q").value.trim();if(!t)return;$("pv").style.display="none";
 run("You are a workplace, construction, farming and home safety expert helping ordinary people. The user searched: \""+t.replace(/"/g,"'")+"\". Identify whether it is a tool, machine or a type of work, and give practical safety guidance. "+FMT)}
function toBlob(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},"image/jpeg",.82);URL.revokeObjectURL(u)};im.onerror=rej;im.src=u})}
async function photo(f){
 if(!f)return;
 try{var b=await toBlob(f);$("pv").src=URL.createObjectURL(b);$("pv").style.display="block";
  var t=$("q").value.trim();
  run("You are a workplace, construction, farming and home safety expert. Identify the tool, machine or work activity in the photo and give practical safety guidance for ordinary people. If unsure of the exact model, say so and give guidance for the type. If nothing relevant is visible, say so in summary. The user's language hint: \""+(t||"none, use English").replace(/"/g,"'")+"\". "+FMT,[b])}catch(e){fail(e)}
}
$("go").onclick=search;$("q").onkeydown=function(e){if(e.key==="Enter")search()};
$("cam").onchange=function(){photo(this.files[0]);this.value=""};$("gal").onchange=function(){photo(this.files[0]);this.value=""};
})();
</script>
</body>
</html>
